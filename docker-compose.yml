# StillGPT backend + its own Postgres. Put secrets in .env (see .env.example).
name: stillgpt

services:
  stillgpt:
    build: .
    image: stillgpt-backend:latest
    container_name: stillgpt
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stillgpt}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stillgpt}
      MEDIA_DIR: /data/media
      # GPU upscaler over ZeroTier (empty = CPU faceswap sidecar only)
      UPSCALE_GPU_URL: ${UPSCALE_GPU_URL:-}
      UPSCALE_GPU_API_KEY: ${UPSCALE_GPU_API_KEY:-}
    ports:
      - "127.0.0.1:${STILLGPT_HOST_PORT:-8790}:8790"   # cloudflared (Zero Trust) on the host points the public domain here
    volumes:
      - media:/data/media
    networks:
      - default
      - automation   # shared with n8n + folax-adapter: http://folax-adapter:8080, and n8n reaches us at http://stillgpt:8790
    depends_on:
      db:
        condition: service_healthy

  # Face swap sidecar (InsightFace-style detect/ArcFace/inswapper + CodeFormer/GFPGAN on onnxruntime CPU).
  # Internal only: the backend reaches it at http://faceswap:8080 (FACESWAP_URL). Models (~1.4 GB) are downloaded
  # on first start into the faceswap_models volume; /health/ready is 503 until they are loaded.
  faceswap:
    build: ./faceswap
    image: stillgpt-faceswap:latest
    container_name: stillgpt-faceswap
    restart: unless-stopped
    environment:
      FACESWAP_API_KEY: ${FACESWAP_API_KEY:-}
      FACESWAP_WORKERS: ${FACESWAP_WORKERS:-2}
      FACESWAP_ORT_THREADS: ${FACESWAP_ORT_THREADS:-2}
    ports:
      - "127.0.0.1:${FACESWAP_HOST_PORT:-8791}:8080"   # debugging only
    volumes:
      - faceswap_models:/models
    networks:
      - default

  db:
    image: postgres:17-alpine
    container_name: stillgpt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stillgpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stillgpt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stillgpt}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  # Volume names are pinned so renaming the folder/project never orphans data. Existing installs can point
  # them at their old volumes via .env (MEDIA_VOLUME / PGDATA_VOLUME).
  media:
    name: ${MEDIA_VOLUME:-stillgpt_media}
  pgdata:
    name: ${PGDATA_VOLUME:-stillgpt_pgdata}
  faceswap_models:
    name: ${FACESWAP_MODELS_VOLUME:-stillgpt_faceswap_models}

networks:
  automation:
    name: ${AUTOMATION_NETWORK:-automation}
    external: true
